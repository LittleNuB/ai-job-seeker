[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "alembic -c alembic.ini upgrade head && python scripts/data/seed_positions.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers"
healthcheckPath = "/api/health"
restartPolicyType = "always"
