[build]
builder = "dockerfile"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "alembic -c alembic.ini upgrade head && python data/seed_positions.py && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers"
restartPolicyType = "on_failure"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
