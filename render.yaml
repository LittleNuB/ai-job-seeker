services:
  - type: web
    name: ai-job-copilot-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_CHAT_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
