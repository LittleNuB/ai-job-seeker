services:
  - type: web
    name: ai-job-copilot-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ALLOW_ORIGINS
        value: https://ai-jobcopilot.vercel.app
      - key: GLM_MODEL
        value: GLM-4.5-AirX
      - key: GLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4/
      - key: GLM_TIMEOUT_SECONDS
        value: "120"
      - key: GLM_MAX_RETRIES
        value: "1"
      - key: JWT_SECRET
        value: replace-with-random-32-char-string
      - key: GLM_API_KEY
        value: your-glm-api-key
