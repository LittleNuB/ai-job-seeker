services:
  - type: web
    name: ai-job-copilot-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    startCommand: alembic -c alembic.ini upgrade head && python data/seed_positions.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ALLOW_ORIGINS
        value: https://ai-jobcopilot.vercel.app
      - key: GLM_MODEL
        value: GLM-4.5-AirX
      - key: GLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4/
      - key: GLM_TIMEOUT_SECONDS
        value: "120"
      - key: GLM_MAX_RETRIES
        value: "1"
      - key: JWT_SECRET
        sync: false
      - key: GLM_API_KEY
        sync: false
